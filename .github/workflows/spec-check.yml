name: spec-check
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install specify-cli
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
      - name: Run specify check
        run: specify check
